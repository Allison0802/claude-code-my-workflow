name: formula-toy
target_script: .claude/skills/method-evolve/examples/synthetic_cox/toy_evaluator.R

prerequisites:
  - id: baseline-meta
    type: sidecar-meta
    required_for: [lower, upper]
    required_keys: [scenario_name, n_subjects, n_sims]
  - id: required-columns
    type: column-presence
    smoke_env_vars:
      SCENARIO_NAME: smoke
      N_SIMS: 2
      N_SUBJECTS: 50
    required_columns: [my_metric, c_index, abs_bias, coverage]

evaluator:
  env_vars:
    SCENARIO_NAME: smoke
    N_SIMS: 50
    N_SUBJECTS: 200
  results_file_pattern: /tmp/synth_cox_smoke_var.rds

substitutions:
  freeze_on_setup: [run_date, name]
  per_variant: [VARIANT_PATH, VARIANT_ID, SEED_BLOCK, SCENARIO_NAME]
  refreeze_behavior: error

slot:
  kind: formula
  lhs: Surv(time, event)
  max_terms: 6
  whitelist: [x1, x2, x3, x4, x5, x6]
  transforms:
    - { name: log, head: log, arity: 1 }
  interactions: pairwise
  forbidden_patterns: []

baselines:
  scenario_match_required: true
  lower:
    results_file: .claude/skills/method-evolve/examples/formula_toy/baselines/lower.rds
    meta_file:    .claude/skills/method-evolve/examples/formula_toy/baselines/lower.meta.json
  upper:
    results_file: .claude/skills/method-evolve/examples/formula_toy/baselines/upper.rds
    meta_file:    .claude/skills/method-evolve/examples/formula_toy/baselines/upper.meta.json

fitness:
  primary:
    template: recovery_ratio
    target: my_metric
    lower: lower.my_metric
    upper: upper.my_metric
    direction: higher_is_better
  recovery:
    denom_floor_epsilon: 0.002
    degenerate_scenario_action: reject_and_halt
    degenerate_variant_fallback:
      fallback_metric: c_index
      cap: 0

gates:
  - { metric: abs_bias, tier: both,   op: "<",  threshold: 0.5 }
  - { metric: c_index,  tier: both,   op: ">=", threshold: 0.55 }

budget:
  max_variants: 8
  batch_size: 2
  max_generations: 2
  promote_top_k: 2
  early_stop_after: 2

compute:
  screen: { backend: local, n_workers: 1 }
  full:   { backend: local }

paths:
  out_dir: quality_reports/evolve/formula-toy
  variants_dir: quality_reports/evolve/formula-toy/variants
  program_db: quality_reports/evolve/formula-toy/PROGRAM_DB.jsonl
  state_file: quality_reports/evolve/formula-toy/EVOLVE_STATE.json
